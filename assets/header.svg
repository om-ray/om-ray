<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Om Ray, full-stack developer">
  <title>Om Ray, full-stack developer</title>
  <defs>
    <clipPath id="round"><rect width="1200" height="320" rx="18"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f0a1f"/>
      <stop offset="0.45" stop-color="#3b1a52"/>
      <stop offset="0.72" stop-color="#b1385e"/>
      <stop offset="0.9" stop-color="#ed894b"/>
      <stop offset="1" stop-color="#f6d860"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffb5"/>
      <stop offset="0.35" stop-color="#f6d860"/>
      <stop offset="0.7" stop-color="#ed894b"/>
      <stop offset="1" stop-color="#d53a42"/>
    </linearGradient>
    <mask id="stripes">
      <rect width="1200" height="320" fill="#fff"/>
      <rect x="0" y="196" width="1200" height="4" fill="#000"/>
      <rect x="0" y="210" width="1200" height="6" fill="#000"/>
      <rect x="0" y="226" width="1200" height="8" fill="#000"/>
      <rect x="0" y="244" width="1200" height="10" fill="#000"/>
    </mask>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <style>
    .stars circle { fill:#fff; animation: twinkle 4s ease-in-out infinite; }
    @keyframes twinkle { 0%,100% { opacity:.25 } 50% { opacity:1 } }
    .layer { animation: drift linear infinite; }
    @keyframes drift { from { transform: translateX(0) } to { transform: translateX(-1200px) } }
    .sun { animation: rise 6s ease-in-out infinite alternate; }
    @keyframes rise { from { transform: translateY(6px) } to { transform: translateY(-6px) } }
    .name { font: 800 76px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing:-2px; fill:#fff; }
    .tag { font: 500 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill:#ffe9c4; }
    .cursor { animation: blink 1.1s steps(1) infinite; fill:#f6d860; }
    @keyframes blink { 50% { opacity:0 } }
    @media (prefers-reduced-motion: reduce) { .layer, .sun, .stars circle, .cursor { animation:none } }
  </style>
  <g clip-path="url(#round)">
  <rect width="1200" height="320" fill="url(#sky)"/>
